{% extends "base.html" %} {% block content %}
<h1 class="text-2xl font-bold mb-4">Excluir medida?</h1>
<p class="text-gray-600 mb-6">
  Tem certeza que deseja excluir "{{ measurement_type.name }}"? Isso também
  remove as medições que usam ela.
</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded">
    Confirmar exclusão
  </button>
  <a
    href="{% url 'measurement_type_list' project.id %}"
    class="ml-2 text-gray-600"
    >Cancelar</a
  >
</form>
{% endblock %}

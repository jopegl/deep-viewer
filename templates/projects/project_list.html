{% extends "base.html" %} {% block content %}
<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold">Projetos</h1>
  <a
    href="{% url 'project_create' %}"
    class="bg-blue-600 text-white px-4 py-2 rounded"
    >Novo projeto</a
  >
</div>
<div class="grid gap-4">
  {% for project in projects %}
  <a
    href="{% url 'experiment_list' project.id %}"
    class="block border rounded p-4 hover:bg-gray-100"
  >
    <h2 class="font-semibold">{{ project.name }}</h2>
    <p class="text-sm text-gray-500">{{ project.description }}</p>
  </a>
  {% empty %}
  <p class="text-gray-500">Nenhum projeto ainda.</p>
  {% endfor %}
</div>
{% endblock %}

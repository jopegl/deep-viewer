{% extends "base.html" %}

{% block title %}Editar projeto | Deep Viewer{% endblock %}
{% block page_class %}page-narrow{% endblock %}

{% block content %}
  <nav class="crumbs" aria-label="Você está em">
    <a href="{% url 'project_list' %}">Projetos</a>
    <span>/</span>
    <span>{{ object.name }}</span>
  </nav>

  <div class="page-head">
    <div>
      <h1>Editar projeto</h1>
    </div>
  </div>

  <form method="post" class="form form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Salvar alterações</button>
      <a class="btn btn-ghost" href="{% url 'project_list' %}">Cancelar</a>
    </div>
  </form>
{% endblock %}

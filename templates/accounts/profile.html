{% extends "base.html" %}
{% load static %}

{% block title %}Meu perfil | Deep Viewer{% endblock %}
{% block page_class %}page-narrow{% endblock %}

{% block content %}
  <div class="page-head">
    <div>
      <h1>Meu perfil</h1>
      <p class="lead">Conectado como {{ user.username }}.</p>
    </div>
  </div>

  <form method="post" class="form form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Salvar alterações</button>
      <a class="btn btn-ghost" href="{% url 'project_list' %}">Meus projetos</a>
    </div>
  </form>
  <script src="{% static 'js/institutions.js' %}" defer></script>
{% endblock %}

<form method="get" class="filter-bar" role="search">
  {% for field in filter_form %}
    <label class="filter-field{% if field.name == 'q' %} filter-search{% endif %}">
      <span class="sr-only">{{ field.label }}</span>
      {{ field }}
    </label>
  {% endfor %}
  <button type="submit" class="btn btn-ghost btn-sm">Buscar</button>
  {% if filter_form.is_active %}
    <a class="btn btn-ghost btn-sm" href="?">Limpar</a>
  {% endif %}
</form>

{% if filter_form.is_active %}
  <p class="filter-count">{{ shown }} de {{ total }} {{ noun }}{{ total|pluralize }}</p>
{% endif %}
